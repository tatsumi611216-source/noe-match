name: PDCA check

# 施策の効果は28日待たないと読めない（インデックスと再評価に3〜4週かかる）。
# 毎週月曜に判定日を過ぎた凍結データを突き合わせ、結果があれば agent/pdca_result.md を更新する。
# 凍結は施策の直後に手動で行う: python scripts/pdca_cycle.py freeze --note "施策の内容"

on:
  schedule:
    - cron: '0 22 * * 0'   # 毎週月曜 7:00 JST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: 効果測定
        run: python scripts/pdca_cycle.py
      - name: 差分があればコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add agent/pdca_result.md
          git diff --cached --quiet || git commit -m "PDCA: 効果測定を更新（自動）"
          git push
